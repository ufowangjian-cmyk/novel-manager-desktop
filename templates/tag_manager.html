<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签管理 - 摸鱼书架</title>
    <link rel="icon" href="{{ url_for('static', filename='images/novel-icon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tag_manager.css') }}">
</head>
<body class="tag-manager-body">
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>
    
    <div class="tag-manager-container">
        <!-- 头部 -->
        <div class="tag-manager-header">
            <h1>
                <span>🏷️</span>
                标签管理
            </h1>
            <div class="tag-manager-desc">
                管理识别关键词、别名映射和派生规则。修改标签后要重新【🔁 全量扫描】才能生效。
            </div>
            <div class="button-group">
                <a href="/config" class="btn btn-secondary">
                    ⚙️ 配置管理
                </a>
                <a href="/" class="btn btn-secondary">
                    🏠 返回首页
                </a>
            </div>
        </div>
        
        <!-- 标签管理内容 -->
        <div class="config-card">
            <div class="card-header" onclick="toggleCard(this)">
                <span class="card-icon">🔑</span>
                <h2>识别关键词</h2>
                <span class="expand-icon">▼</span>
            </div>
            <div class="card-content">
                <div class="keyword-list-container" id="keywordListContainer">
                    <!-- 动态加载关键词列表 -->
                </div>
                <div class="add-keyword-group" style="margin-top: 10px; display: flex; gap: 10px;">
                    <input type="text" id="newKeyword" placeholder="输入新关键词" maxlength="20" style="flex: 1;">
                    <button class="btn btn-success" onclick="addKeyword()">➕ 添加</button>
                </div>
                <div class="form-hint">
                    💡 程序会从文件名和内容中匹配这些关键词，匹配到的会自动成为标签
                </div>
            </div>
        </div>
        
        <div class="config-card">
            <div class="card-header" onclick="toggleCard(this)">
                <span class="card-icon">🔗</span>
                <h2>别名映射</h2>
                <span class="expand-icon">▼</span>
            </div>
            <div class="card-content">
                <div class="alias-list-container" id="aliasListContainer">
                    <!-- 动态加载别名列表 -->
                </div>
                <div class="add-alias-group" style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="aliasMainTag" placeholder="主标签" maxlength="30" style="flex: 1;">
                    <span>→</span>
                    <input type="text" id="aliasTag" placeholder="别名（多个用逗号分隔）" maxlength="200" style="flex: 2;">
                    <button class="btn btn-success" onclick="addAlias()">➕ 添加</button>
                </div>
                <div class="form-hint">
                    💡 别名会自动转换为主标签，例如：输入"牛头人" → 自动变成"NTR"
                </div>
            </div>
        </div>
        
        <!-- 别名编辑弹窗 -->
        <div id="aliasModal" class="modal" style="display: none;">
            <div class="modal-overlay" onclick="closeAliasModal()"></div>
            <div class="modal-container">
                <div class="modal-header">
                    <h3>✏️ 编辑别名映射</h3>
                    <button class="modal-close" onclick="closeAliasModal()">✖</button>
                </div>
                <div class="modal-body">
                    <div class="modal-field">
                        <label>主标签</label>
                        <input type="text" id="modalMainTag" readonly class="modal-input-readonly">
                        <span class="form-hint">主标签不可修改，如需修改请删除后重新添加</span>
                    </div>
                    <div class="modal-field">
                        <label>别名列表</label>
                        <textarea id="modalAliases" rows="4" placeholder="多个别名用逗号分隔，例如：牛头人,绿帽,被戴绿帽" maxlength="500"></textarea>
                        <span class="form-hint">💡 支持中英文逗号、空格分隔</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeAliasModal()">取消</button>
                    <button class="btn btn-success" onclick="saveAliasFromModal()">保存</button>
                </div>
            </div>
        </div>

        <div class="config-card">
            <div class="card-header" onclick="toggleCard(this)">
                <span class="card-icon">📌</span>
                <h2>派生规则</h2>
                <span class="expand-icon">▼</span>
            </div>
            <div class="card-content">
                <div class="rule-list-container" id="ruleListContainer">
                    <!-- 动态加载派生规则列表 -->
                </div>
                <div class="add-rule-group" style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="sourceTag" placeholder="源标签" maxlength="30" style="flex: 1;">
                    <span>→</span>
                    <input type="text" id="derivedTag" placeholder="派生标签（多个用逗号分隔）" maxlength="200" style="flex: 2;">
                    <button class="btn btn-success" onclick="addDerivedRule()">➕ 添加</button>
                </div>
                <div class="form-hint">
                    💡 当小说有"源标签"时，自动添加"派生标签"，例如：有"母子" → 自动添加"乱伦"
                </div>
            </div>
        </div>
        
        <div class="button-group" style="margin-top: 20px; justify-content: center;">
            <button class="btn btn-secondary" onclick="exportTagRules()">📤 导出标签规则</button>
            <button class="btn btn-secondary" onclick="importTagRules()">📥 导入标签规则</button>
            <button class="btn btn-warning" onclick="reloadTagRules()">🔄 重载规则</button>
            <button class="btn btn-secondary" onclick="resetTagRules()">↺ 重置为默认</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tag-manager.js') }}"></script>
    <script>
        // 标签页初始化
        (function() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initTagPage);
            } else {
                initTagPage();
            }
            
            function initTagPage() {
                console.log('🏷️ 标签页初始化开始');
                
                // 1. 主题
                if (typeof loadAndApplyTheme === 'function') {
                    loadAndApplyTheme();
                    watchSystemTheme();
                }
                
                // 2. 轮播图
                if (typeof initCarousel === 'function') {
                    initCarousel('.tag-manager-header', {
                        autoSlideshow: true,
                        intervalTime: 8000
                    });
                }
                
                // 3. 展开所有卡片
                document.querySelectorAll('.config-card').forEach(card => {
                    card.classList.remove('collapsed');
                });
                
                // 4. 加载标签规则
                if (typeof loadTagRules === 'function') {
                    loadTagRules();
                }
                
                console.log('✅ 标签页初始化完成');
            }
        })();
    </script>
</body>
</html>
